<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1514">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rehab Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;600;700&display=swap">
<style>
/* ===== tokens: dark first, light via system or the in-app toggle ===== */
:root{
  color-scheme:dark;
  --bg:#0e1514; --surface:#151e1d; --surface2:#1b2726; --surface3:#233331; --line:#29393a;
  --text:#e6efed; --muted:#98aca9; --ghost:#667b78;
  --accent:#3ccfba; --accent-text:#62e2ce; --accent-ink:#04221e; --accent-soft:#123d38;
  --hold:#e9ad45; --hold-text:#f4c66e; --hold-soft:#3a2d14;
  --stop:#ef6b64; --stop-text:#ff9690; --stop-soft:#3e1e1d;
  --ph1:#1f8f82; --ph2:#3dbcab; --ph-trip:#d28e32; --ph3:#4b87c6; --ph-test:#96a3ba; --ph-m:#7ab87a;
  --fig-body:#d8e5e2; --fig-far:#5f7572; --fig-floor:#364b4b; --fig-prop:#243433; --fig-prop-line:#6d8683; --fig-arrow:#c3d2cf;
  --shadow:0 14px 36px rgba(0,0,0,.55);
  --font-body:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Poppins","Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f1f5f4; --surface:#ffffff; --surface2:#ecf2f0; --surface3:#dfe9e6; --line:#d2dedb;
    --text:#13201e; --muted:#536764; --ghost:#8ca09d;
    --accent:#0f7c70; --accent-text:#0b6a5f; --accent-ink:#ffffff; --accent-soft:#dbefeb;
    --hold:#c07d10; --hold-text:#895705; --hold-soft:#fbf0da;
    --stop:#cf4740; --stop-text:#b1302a; --stop-soft:#fbe6e4;
    --ph1:#0b5f59; --ph2:#11776e; --ph-trip:#a0620f; --ph3:#2f5f8f; --ph-test:#3a475c; --ph-m:#3f7f3f;
    --fig-body:#2b3b39; --fig-far:#a3b4b1; --fig-floor:#c4d2cf; --fig-prop:#dee8e5; --fig-prop-line:#8aa09d; --fig-arrow:#4c605d;
    --shadow:0 14px 36px rgba(18,40,37,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f5f4; --surface:#ffffff; --surface2:#ecf2f0; --surface3:#dfe9e6; --line:#d2dedb;
  --text:#13201e; --muted:#536764; --ghost:#8ca09d;
  --accent:#0f7c70; --accent-text:#0b6a5f; --accent-ink:#ffffff; --accent-soft:#dbefeb;
  --hold:#c07d10; --hold-text:#895705; --hold-soft:#fbf0da;
  --stop:#cf4740; --stop-text:#b1302a; --stop-soft:#fbe6e4;
  --ph1:#0b5f59; --ph2:#11776e; --ph-trip:#a0620f; --ph3:#2f5f8f; --ph-test:#3a475c; --ph-m:#3f7f3f;
  --fig-body:#2b3b39; --fig-far:#a3b4b1; --fig-floor:#c4d2cf; --fig-prop:#dee8e5; --fig-prop-line:#8aa09d; --fig-arrow:#4c605d;
  --shadow:0 14px 36px rgba(18,40,37,.18);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1514; --surface:#151e1d; --surface2:#1b2726; --surface3:#233331; --line:#29393a;
  --text:#e6efed; --muted:#98aca9; --ghost:#667b78;
  --accent:#3ccfba; --accent-text:#62e2ce; --accent-ink:#04221e; --accent-soft:#123d38;
  --hold:#e9ad45; --hold-text:#f4c66e; --hold-soft:#3a2d14;
  --stop:#ef6b64; --stop-text:#ff9690; --stop-soft:#3e1e1d;
  --ph1:#1f8f82; --ph2:#3dbcab; --ph-trip:#d28e32; --ph3:#4b87c6; --ph-test:#96a3ba; --ph-m:#7ab87a;
  --fig-body:#d8e5e2; --fig-far:#5f7572; --fig-floor:#364b4b; --fig-prop:#243433; --fig-prop-line:#6d8683; --fig-arrow:#c3d2cf;
  --shadow:0 14px 36px rgba(0,0,0,.55);
}

/* ===== base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--font-body);min-height:100%;overscroll-behavior-y:contain}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,select,textarea{min-width:0;font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.4}
input[type=number]{-moz-appearance:textfield;text-align:center;font-variant-numeric:tabular-nums}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tnum{font-variant-numeric:tabular-nums}

/* ===== shell ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--bg) 72%,transparent);
  padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
.brand{font:700 19px/1 var(--font-head);letter-spacing:.11em;text-transform:uppercase}
.brand b{color:var(--accent-text);font-weight:700}
.top .date{color:var(--muted);font-size:13px;text-align:right}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.wrap > *{min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font:700 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent-text)}

.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;
  background:var(--hold-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--hold) 45%,transparent)}
.banner button{margin-left:auto;color:var(--muted);font-weight:700;padding:0 2px}

/* ===== cards & type ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.flat{background:transparent;border:0;padding:0}
.eyebrow{font:600 11.5px/1.2 var(--font-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:17px;font-weight:600}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sp{height:4px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px 0}
.sechead h2{font-size:19px;font-weight:600}
.sechead .muted{font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px;text-align:center;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--stop-text);border-color:color-mix(in srgb,var(--stop) 55%,transparent)}
.btn.block{display:flex;width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:10px}
.btn:active{transform:scale(.985)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.link{color:var(--accent-text);font-weight:700}

/* ===== today: header ===== */
.dayhead{display:grid;gap:10px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav .arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.datenav .arrow svg{width:18px;height:18px}
.datenav .mid{flex:1;text-align:center;min-width:0}
.datenav .mid .d{font:600 15px/1.2 var(--font-head)}
.datenav .mid .s{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1 var(--font-body);letter-spacing:.04em;padding:5px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pill.accent{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.pill.hold{color:var(--hold-text);border-color:color-mix(in srgb,var(--hold) 50%,transparent);background:var(--hold-soft)}
.pill.stop{color:var(--stop-text);border-color:color-mix(in srgb,var(--stop) 50%,transparent);background:var(--stop-soft)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wsd{border-radius:11px;padding:6px 0 7px;display:grid;justify-items:center;gap:4px;border:1px solid transparent;color:var(--muted)}
.wsd .l{font:700 10.5px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.wsd .n{font:600 15px/1 var(--font-head);color:var(--text)}
.wsd.sel{background:var(--surface);border-color:var(--line)}
.wsd.today .n{color:var(--accent-text)}
.wsd.future{opacity:.55}
.ring{width:22px;height:22px}
.ring .t{stroke:var(--surface3)}
.ring .v{stroke:var(--accent)}

.titleblock{display:grid;gap:4px}
.titleblock h1{font-size:25px;font-weight:700;letter-spacing:-.005em}
.titleblock .sub{color:var(--muted);font-size:14.5px}

/* ===== morning check ===== */
.q{font:600 15px/1.3 var(--font-head)}
.qhint{font-size:13px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale button{height:44px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);
  font:700 15px/1 var(--font-body);font-variant-numeric:tabular-nums;text-align:center;color:var(--text)}
.scale button.on{color:#fff;border-color:transparent}
.scale button.on.lv0{background:var(--accent);color:var(--accent-ink)}
.scale button.on.lv1{background:var(--hold);color:#241603}
.scale button.on.lv2{background:var(--stop);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;text-align:center;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.delta{font-size:13.5px;color:var(--muted)}
.delta b{color:var(--text)}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
details.more[open] summary .chev{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--muted);text-align:left}
.chip.on{color:var(--stop-text);border-color:color-mix(in srgb,var(--stop) 60%,transparent);background:var(--stop-soft)}
.chip.on.hold{color:var(--hold-text);border-color:color-mix(in srgb,var(--hold) 60%,transparent);background:var(--hold-soft)}

/* ===== verdict ===== */
.verdict{border-radius:16px;padding:14px;display:grid;grid-template-columns:36px 1fr;gap:4px 12px;border:1px solid var(--line);background:var(--surface)}
.verdict .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.verdict .ic svg{width:20px;height:20px}
.verdict h3{font-size:16.5px;font-weight:600;align-self:center}
.verdict .body{grid-column:2;display:grid;gap:6px;font-size:14.5px}
.verdict .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.verdict.go{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.verdict.go .ic{background:var(--accent);color:var(--accent-ink)}
.verdict.go h3{color:var(--accent-text)}
.verdict.hold{background:var(--hold-soft);border-color:color-mix(in srgb,var(--hold) 40%,transparent)}
.verdict.hold .ic{background:var(--hold);color:#241603}
.verdict.hold h3{color:var(--hold-text)}
.verdict.stop{background:var(--stop-soft);border-color:color-mix(in srgb,var(--stop) 45%,transparent)}
.verdict.stop .ic{background:var(--stop);color:#fff}
.verdict.stop h3{color:var(--stop-text)}
.verdict.info .ic{background:var(--surface3);color:var(--muted)}
.notes{display:grid;gap:6px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.note .dot{width:8px;height:8px;border-radius:50%;background:var(--hold);margin-top:6px;flex:none}
.note.info .dot{background:var(--muted)}
.note .grow b{font-weight:700}
.note button{flex:none}

/* ===== checklist ===== */
.list{display:grid}
.grp{font:600 11.5px/1 var(--font-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.grp:first-child{padding-top:2px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.grp + .item,.list > .item:first-child{border-top:0}
.checks{display:flex;gap:5px}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:transparent}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk.sm{width:40px;font:700 11px/1 var(--font-body);letter-spacing:.04em;color:var(--muted)}
.chk.sm.on{color:var(--accent-ink)}
.chk:disabled{opacity:.45}
.iname{display:grid;gap:2px;min-width:0;padding:2px 0}
.iname .nm{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iname .nm .how{color:var(--ghost);display:inline-grid;place-items:center}
.iname .nm .how svg{width:14px;height:14px}
.iname .dose{font-size:13.5px;color:var(--muted);line-height:1.35}
.iname .inote{font-size:13px;color:var(--text);opacity:.85;font-style:italic}
.opt{font:700 10.5px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px}
.pchip{min-width:48px;height:32px;padding:0 9px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:13px;text-align:center;
  color:var(--muted);background:transparent;font-variant-numeric:tabular-nums}
.pchip.lv0{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.pchip.lv1{color:var(--hold-text);border-color:color-mix(in srgb,var(--hold) 50%,transparent);background:var(--hold-soft)}
.pchip.lv2{color:var(--stop-text);border-color:color-mix(in srgb,var(--stop) 55%,transparent);background:var(--stop-soft)}
.iwarn{grid-column:2/-1;font-size:13px;color:var(--stop-text)}
.item.done .iname .nm{color:var(--text)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.addrow .btn{flex:1 1 auto;white-space:nowrap}
.count{font:600 13px/1 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.dnote{font-size:14px;color:var(--muted);padding:2px 2px 0}
.tip{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.tip b{color:var(--text)}

/* ===== checkpoint / tests ===== */
.crit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit .t{font-size:14.5px}
.crit .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.yn{display:flex;gap:4px}
.yn button{min-width:52px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--muted);text-align:center;padding:0 8px}
.yn button.yes.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yn button.no.on{background:var(--hold);border-color:var(--hold);color:#241603}
.outcome{margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center}
.outcome.go{background:var(--accent-soft);color:var(--accent-text)}
.outcome.hold{background:var(--hold-soft);color:var(--hold-text)}
.outcome.stop{background:var(--stop-soft);color:var(--stop-text)}
.outcome.info{background:var(--surface2);color:var(--muted)}
.curlrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.curlrow label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:4px}
.verdtable{display:grid;gap:4px;margin-top:6px}
.verdtable div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:10px;font-size:14px}
.verdtable div:nth-child(1){background:var(--accent-soft)}
.verdtable div:nth-child(2){background:var(--hold-soft)}
.verdtable div:nth-child(3){background:var(--stop-soft)}
.verdtable b{font-weight:700}

/* ===== plan tab ===== */
.summary{display:grid;gap:12px}
.summary .big{font:700 22px/1.2 var(--font-head)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.summary > *{min-width:0}
.fact{background:var(--surface2);border-radius:12px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted);font-weight:700}
.fact .v{font:600 15px/1.3 var(--font-head);margin-top:2px}
.timeline{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.5fr) minmax(0,.8fr);gap:3px}
.tl{overflow-wrap:anywhere;padding:8px 7px;border-radius:9px;color:#fff;font:700 10.5px/1.15 var(--font-body);letter-spacing:.04em;text-transform:uppercase;min-width:0;opacity:.55}
.tl small{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;opacity:.92;margin-top:3px}
.tl.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.tl.w1{background:var(--ph1)} .tl.w2{background:var(--ph2)} .tl.tr{background:var(--ph-trip)} .tl.w3{background:var(--ph3)} .tl.te{background:var(--ph-test)}
:root[data-theme="light"] .tl.w2,:root[data-theme="light"] .tl.te{color:#fff}
.dayrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%}
.dayrow:first-child{border-top:0}
.dayrow .dn{font:600 14px/1.1 var(--font-head);text-align:center;border-radius:10px;padding:7px 0;background:var(--surface2)}
.dayrow .dn small{display:block;font:700 10px/1 var(--font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.dayrow.cur .dn{background:var(--accent);color:var(--accent-ink)}
.dayrow.cur .dn small{color:var(--accent-ink);opacity:.8}

<script>
"use strict";
const BUILD = "pages";
/* =====================================================================
   PLAN DATA — criteria-based hamstring strain rehab
   (Askling L-protocol + progressive loading). Dates come from setup.
   ===================================================================== */
const INJURY_DATE = "";
const PLAN_START = "";

function it(ex, dose, o) { return Object.assign({ ex: ex, dose: dose }, o || {}); }
const EXT = () => it("extender", "3 × 12 · morning and evening", { twice: true });
const CORE_DOSE = "Dead bugs, side plank, Pallof press";

/* ---- Weeks 1–2: one entry per plan day ---- */
const PLAN_DAYS = {
  1: { wk: 1, items: [
    it("walk", "As normal a stride as pain allows", { label: "Short walks", group: "Daily basics" }),
    it("heelslide", "About 10 slow reps, a few times a day", { group: "Daily basics" }),
    it("ice", "15–20 min after activity", { group: "Daily basics" })
  ] },
  2: { wk: 1, items: [
    it("heeldig", "About 30% effort · 5 × 10 sec, 2–3 times today"),
    it("walk", "As normal a stride as pain allows", { label: "Short walks", group: "Daily basics" }),
    it("heelslide", "About 10 slow reps, a few times a day", { group: "Daily basics" }),
    it("ice", "15–20 min after activity", { group: "Daily basics" })
  ] },
  3: { wk: 1, items: [
    it("heeldig", "40–50% effort · 5 × 10 sec, 2–3 times"),
    it("bridge", "2 × 10", { label: "Double-leg bridges" }),
    it("peloton", "10 min, easy, no resistance"),
    it("walk", "As normal a stride as pain allows", { label: "Short walks", group: "Daily basics" }),
    it("heelslide", "About 10 slow reps, a few times a day", { group: "Daily basics" }),
    it("ice", "15–20 min after activity", { group: "Daily basics" })
  ] },
  4: { wk: 1, items: [
    it("heeldig", "50–60% effort · 5 × 10 sec, 2–3 times"),
    it("bridge", "3 × 10", { label: "Bridges" }),
    it("walk", "One continuous 20-min walk", { label: "Continuous walk" }),
    it("heelslide", "About 10 slow reps, a few times a day")
  ] },
  5: { wk: 1, note: "The L-protocol starts today. The Extender runs every day, morning and evening, from now on.", items: [
    EXT(),
    it("diver", "3 × 6"),
    it("glider", "3 × 4"),
    it("walk", "As normal a stride as pain allows", { label: "Short walks", group: "Daily basics" }),
    it("heelslide", "A few sets through the day", { group: "Daily basics" })
  ] },
  6: { wk: 1, items: [
    EXT(),
    it("bridge", "3 × 12", { label: "Bridges" }),
    it("walk", "25–30 min", { label: "Walk" }),
    it("core", CORE_DOSE),
    it("heelslide", "A few sets through the day")
  ] },
  7: { wk: 1, items: [
    EXT(),
    it("diver", "3 × 6"),
    it("slbridge", "2 × 8 · give them a try"),
    it("walk", "As normal a stride as pain allows", { label: "Short walks", group: "Daily basics" }),
    it("heelslide", "A few sets through the day", { group: "Daily basics" })
  ], checks: [
    { id: "limp7", q: "Is the limp clearly better than it was on Day 1?",
      no: "Hold at this level for a day or two (Repeat yesterday's level) before Week 2 adds load." }
  ] },
  8: { wk: 2, items: [
    EXT(),
    it("glider", "3 × 4"),
    it("slbridge", "3 × 10"),
    it("longbridge", "3 × 10"),
    it("calfraise", "3 × 15"),
    it("core", CORE_DOSE),
    it("walk", "30–40 min", { label: "Walk" })
  ] },
  9: { wk: 2, items: [
    EXT(),
    it("diver", "3 × 6"),
    it("peloton", "20–30 min, light resistance")
  ] },
  10: { wk: 2, items: [
    EXT(),
    it("slidecurl", "Both legs, short range · 3 × 6"),
    it("boxsquat", "Bodyweight · 3 × 10"),
    it("core", CORE_DOSE),
    it("walk", "40–45 min", { label: "Walk" })
  ] },
  11: { wk: 2, note: "Trip-check day. Leaving before Day 13? Do this walk 2–3 days before you go instead.", items: [
    EXT(),
    it("diver", "3 × 6"),
    it("glider", "3 × 4"),
    it("tripcheck", "45–60 min brisk, with hills or stairs", { label: "Trip-check walk", test: "trip" })
  ] },
  12: { wk: 2, items: [
    EXT(),
    it("slbridge", "Easy effort", { group: "Light strength" }),
    it("slidecurl", "Easy effort", { group: "Light strength" }),
    it("core", CORE_DOSE),
    it("walk", "Easy pace", { label: "Easy walk" })
  ], tripMorning: true },
  13: { wk: 2, items: [
    EXT(),
    it("diver", "3 × 6"),
    it("walk", "Easy pace", { label: "Easy walk" })
  ] },
  14: { wk: 2, items: [
    EXT(),
    it("glider", "3 × 4")
  ], checks: [
    { id: "limp14", q: "Walking with no limp?",
      no: "Still limping at two weeks: get re-checked. Ask for imaging, or raise it with your doctor." }
  ] }
};

const WEEK_INFO = {
  1: { title: "Settle it down",
       intro: "Calm the muscle down, keep it moving, and start gentle loading. The L-protocol starts on Day 5.",
       tip: "Upper-body days are fine from Day 2 with two tweaks: bend your knees more on seated rows, and do DB rows chest-supported on an incline bench. Lower A and B are on hold until Week 3." },
  2: { title: "Load it and prep for the trip",
       intro: "The Extender runs every day, morning and evening. Do the core tail on strength days.",
       tip: "No jogging before the trip. It adds risk and does nothing for the hikes." }
};

/* ---- Trip ---- */
const TRIP_CHECK = [
  { k: "walk", text: "45–60 minutes of brisk walking with hills, no limp, pain 2/10 or less" },
  { k: "morning", text: "No worse the next morning" },
  { k: "easy", text: "Single-leg bridges and the Diver feel easy" }
];
const TRIP_RULES = [
  "Use poles, take short steps on steep parts, and don't jog or jump down anything.",
  "Turn around if pain climbs past 3/10.",
  "If you fly, get up and walk the aisle every hour or so.",
  "Keep up the routine. None of it needs equipment."
];

/* ---- Weeks 3–6 ---- */
const WEEKS = {
  3: { title: "Start jogging",
       runs: "Mon: 6 rounds of 1 min easy jog / 1 min walk. Thu: 8 rounds of 2 min jog / 1 min walk, if Monday felt easy and the next morning was fine. If not, repeat Monday.",
       strength: "Single-leg bridges, sliding leg curls, cable pull-throughs, Smith squats at about 60% of your usual weight, and light eccentric leg curls (lift with both legs, lower with the left over 3–4 sec).",
       moveOn: "8 rounds of 2-min jogs feel easy, pain stays at 2/10 or less, and mornings are no worse." },
  4: { title: "Build speed",
       runs: "15–20 min continuous easy jog, then 6 × 60 m build-ups to 60–70% speed.",
       strength: "Single-leg sliding curls, heavier eccentric curls, band-assisted Nordics 2 × 4. Smith RDLs come back at 50–65 lb with your 3-sec lowering, plus light Bulgarian split squats.",
       moveOn: "Build-ups to 70% feel smooth and pain-free, and mornings are no worse." },
  5: { title: "Get sport-ready",
       runs: "6–8 × 60 m strides at 80–90%, plus side shuffles and cuts. Then softball: throwing, fielding, and easy base running.",
       strength: "Nordics 3 × 5 with less band help, Smith RDL back to 95 lb, and otherwise your full Lower A (Tue) and Lower B (Fri).",
       moveOn: "Strides at 90% and cuts feel pain-free, with no hesitation." },
  6: { title: "Full speed and the test",
       runs: "Mon: 4–6 × 30–40 m at full speed, with full rest (2–3 min) between. Thu: sprint, kick and range checks of the 100% test.",
       strength: "Full Lower A and B, with Nordics 3 × 5. Friday opens with the single-leg curl check.",
       moveOn: "Pass all four parts of the 100% test." }
};

const WEEKLY_LAYOUT = [
  ["Mon", "Run + Upper A"], ["Tue", "Lower strength"], ["Wed", "Off or easy Peloton"],
  ["Thu", "Run + Upper B"], ["Fri", "Lower strength"], ["Sat", "Long walk"], ["Sun", "Rest"]
];

/* weekday index: 0 = Mon … 6 = Sun */
function weekItems(w, d) {
  const items = [];
  const warm = () => it("warmup", "Easy jog, leg swings, 3–4 build-ups", { label: "Warm-up" });
  const upper = (x) => it("upper", "Your regular Upper " + x + " · log the lifts in LiftLog", { label: "Upper " + x });
  // runs + upper
  if (d === 0 || d === 3) {
    if (w === 3) items.push(it("jogwalk", d === 0 ? "6 rounds: 1 min easy jog / 1 min walk"
      : "8 rounds: 2 min jog / 1 min walk. Only if Monday felt easy and the next morning was fine; otherwise repeat Monday.", { label: "Jog/walk intervals" }));
    if (w === 4) items.push(it("buildups", "15–20 min continuous easy jog, then 6 × 60 m build-ups to 60–70%", { label: "Easy jog + build-ups" }));
    if (w === 5) {
      items.push(warm());
      items.push(it("strides", "6–8 × 60 m at 80–90%"));
      items.push(it("cuts", "Side shuffles and cuts"));
      items.push(it("softball", "Throwing, fielding, easy base running", { label: "Softball skills" }));
    }
    if (w === 6 && d === 0) { items.push(warm()); items.push(it("sprints", "4–6 × 30–40 m at full speed · 2–3 min rest")); }

/* =====================================================================
   FIGURES — pose-based stick figures (side view, y-up model space)
   Teal = left (injured) leg. Faded pose = start position.
   ===================================================================== */
const Fig = (() => {
  const LEN = { torso: 28, neck: 3.5, headR: 6, upper: 16, fore: 16, thigh: 21, shin: 21, foot: 8 };
  const R = Math.PI / 180;
  const P = (p, a, l) => [p[0] + Math.cos(a * R) * l, p[1] + Math.sin(a * R) * l];
  const f1 = n => Math.round(n * 10) / 10;
  const SCALE = 2.3; // px per model unit, so every figure shares one line weight and head size

  function ik(root, target, l1, l2, bend) {
    const dx = target[0] - root[0], dy = target[1] - root[1];
    let d = Math.hypot(dx, dy) || 0.001;
    const max = l1 + l2 - 0.05;
    let t = target;
    if (d > max) { t = [root[0] + dx / d * max, root[1] + dy / d * max]; d = max; }
    const base = Math.atan2(dy, dx);
    const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const A = Math.acos(Math.max(-1, Math.min(1, c)));
    const ang = base + (bend || 1) * A;
    const mid = [root[0] + Math.cos(ang) * l1, root[1] + Math.sin(ang) * l1];
    const a2 = Math.atan2(t[1] - mid[1], t[0] - mid[0]);
    return [mid, [mid[0] + Math.cos(a2) * l2, mid[1] + Math.sin(a2) * l2]];
  }
  function leg(hip, s, face) {
    let knee, ankle;
    if (s.ankle) [knee, ankle] = ik(hip, s.ankle, LEN.thigh, LEN.shin, s.bend || 1);
    else { knee = P(hip, s.th, LEN.thigh); ankle = P(knee, s.sh, LEN.shin); }
    const shinAng = Math.atan2(ankle[1] - knee[1], ankle[0] - knee[0]) / R;
    const ft = s.ft != null ? s.ft : shinAng + 65 * face;
    const toe = s.nofoot ? null : P(ankle, ft, s.footLen || LEN.foot);
    return { knee, ankle, toe };
  }
  function arm(sh, s) {
    let elbow, hand;
    if (s.hand) [elbow, hand] = ik(sh, s.hand, LEN.upper, LEN.fore, s.bend || 1);
    else { elbow = P(sh, s.up, LEN.upper); hand = P(elbow, s.fo, LEN.fore); }
    return { elbow, hand };
  }
  function solve(p) {
    const face = p.face || 1;
    const hip = p.hip;
    const sh = P(hip, p.torso, LEN.torso);
    const hd = p.headDir != null ? p.headDir : p.torso;
    const neck = P(sh, hd, LEN.neck);
    const head = P(sh, hd, LEN.neck + LEN.headR);
    return {
      hip, sh, neck, head,
      legL: leg(hip, p.L, face), legR: leg(hip, p.R, face),
      armA: p.A ? arm(sh, p.A) : null, armB: p.B ? arm(sh, p.B) : null
    };
  }

  /* ---- svg helpers (flip y) ---- */
  const X = p => f1(p[0]), Y = p => f1(-p[1]);
  const poly = (pts, cls) => `<polyline class="${cls}" points="${pts.filter(Boolean).map(p => X(p) + "," + Y(p)).join(" ")}"/>`;

  function drawPose(s, ghost) {
    const g = [];
    // far limbs first
    g.push(poly([s.hip, s.legR.knee, s.legR.ankle, s.legR.toe], "f-far"));
    if (s.armB) g.push(poly([s.sh, s.armB.elbow, s.armB.hand], "f-far"));
    // torso + neck + head
    g.push(poly([s.hip, s.sh, s.neck], "f-body"));
    g.push(`<circle class="f-head" cx="${X(s.head)}" cy="${Y(s.head)}" r="${LEN.headR}"/>`);
    if (s.armA) g.push(poly([s.sh, s.armA.elbow, s.armA.hand], "f-body"));
    // the left leg on top
    g.push(poly([s.hip, s.legL.knee, s.legL.ankle, s.legL.toe], "f-leg"));
    g.push(`<circle class="f-hipdot" cx="${X(s.hip)}" cy="${Y(s.hip)}" r="1.9"/>`);
    return `<g class="${ghost ? "f-ghost" : "f-solid"}">${g.join("")}</g>`;
  }

  function ref(v, poses) {
    if (Array.isArray(v)) return v;
    // "a.legL.ankle" / "b.sh" / "b.armA.hand"
    const parts = v.split(".");
    let o = poses[parts[0]];
    for (let i = 1; i < parts.length; i++) o = o && o[parts[i]];
    return o || [0, 0];
  }
  const add = (p, o) => o ? [p[0] + o[0], p[1] + o[1]] : p;

  function arrowPath(p0, p1, bulge, dbl) {
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
    const L = Math.hypot(dx, dy) || 1;
    const c = [mx - dy / L * (bulge || 0), my + dx / L * (bulge || 0)];
    const head = (tip, from) => {
      const a = Math.atan2(tip[1] - from[1], tip[0] - from[0]);
      const h1 = P(tip, a / R + 150, 4.2), h2 = P(tip, a / R - 150, 4.2);
      return `<path class="f-arrowhead" d="M${X(h1)},${Y(h1)} L${X(tip)},${Y(tip)} L${X(h2)},${Y(h2)}"/>`;
    };
    let s = `<path class="f-arrow" d="M${X(p0)},${Y(p0)} Q${X(c)},${Y(c)} ${X(p1)},${Y(p1)}"/>` + head(p1, c);

      case "circle": { const c = add(ref(pr.c, poses), pr.off); push([c[0] - pr.r, c[1] - pr.r], [c[0] + pr.r, c[1] + pr.r]);

      case "arrow": { const a = add(ref(pr.from, poses), pr.oa), b = add(ref(pr.to, poses), pr.ob);

        const c = ref(pr.c, poses), p0 = P(c, pr.a1, pr.r), p1 = P(c, pr.a2, pr.r); push(p0, p1);
        return `<path class="f-arrow" d="M${X(p0)},${Y(p0)} A${pr.r},${pr.r} 0 0 0 ${X(p1)},${Y(p1)}"/>`; }
      case "text": { const w = String(pr.s).length * 3.1, a = pr.anchor || "middle";
        const xl = a === "start" ? pr.x : a === "end" ? pr.x - w : pr.x - w / 2; push([xl, pr.y - 2], [xl + w, pr.y + 5]);
        return `<text class="f-text" x="${pr.x}" y="${f1(-pr.y)}" text-anchor="${pr.anchor || "middle"}">${pr.s}</text>`; }
      default: return "";
    }
  }

  function render(spec, label) {
    if (!spec) return "";
    if (spec.custom) return custom[spec.custom](label);
    const poses = {};
    if (spec.a) poses.a = solve(spec.a);
    if (spec.b) poses.b = solve(spec.b);
    const bounds = [];
    const collect = s => {
      if (!s) return;
      [s.hip, s.sh, s.neck, s.legL.knee, s.legL.ankle, s.legL.toe, s.legR.knee, s.legR.ankle, s.legR.toe,
        s.armA && s.armA.elbow, s.armA && s.armA.hand, s.armB && s.armB.elbow, s.armB && s.armB.hand]
        .filter(Boolean).forEach(p => bounds.push(p));
      bounds.push([s.head[0] - LEN.headR, s.head[1] - LEN.headR], [s.head[0] + LEN.headR, s.head[1] + LEN.headR]);
    };
    collect(poses.a); collect(poses.b);
    const back = (spec.props || []).map(p => drawProp(p, poses, bounds)).join("");
    const ga = (spec.propsA || []).map(p => drawProp(p, poses, bounds)).join("");
    const gb = (spec.propsB || []).map(p => drawProp(p, poses, bounds)).join("");
    const front = (spec.over || []).map(p => drawProp(p, poses, bounds)).join("");
    let body = back;
    if (poses.a && poses.b) body += `<g class="f-ghost">${ga}</g>` + drawPose(poses.a, true) + gb + drawPose(poses.b, false);
    else body += ga + gb + drawPose(poses.b || poses.a, false);
    body += front;
    const pad = spec.pad || 5;
    const xs = bounds.map(p => p[0]), ys = bounds.map(p => p[1]);
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
    const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;

    return `<svg class="fig" width="${Math.round((x1 - x0) * K)}" height="${Math.round((y1 - y0) * K)}" viewBox="${f1(x0)} ${f1(-y1)} ${f1(x1 - x0)} ${f1(y1 - y0)}" role="img" aria-label="${label || "Exercise diagram"}">${body}</svg>`;

const pad2 = n => String(n).padStart(2, "0");

const inTrip = date => tripSet() && date >= S.cfg.tripStart && date <= S.cfg.tripEnd;

function progWeek(k) {
  let w = 3;
  for (let i = 0; i < k; i++) {
    if (w === "M") break;
    const r = S.weekResults[i];
    if (r === true) w = w === 6 ? "M" : w + 1;

  if (t.walk && t.morning && t.easy) return { level: "go", short: "Moderate hikes", text: "Moderate hikes are fine." };
  if (t.walk && t.morning && t.easy === false) return { level: "hold", short: "Easier trails", text: "Stick to easier, flatter trails." };

    return Object.assign(base, { phase: "pre", eyebrow: inj ? fmtShort(S.cfg.injury) : "Before the plan", title: inj ? "Injury day" : "Before the plan", label: inj ? "Injury day" : "Before the plan" });

/* ---------------- guidance (the plan's rules) ---------------- */
const RUN_EX = new Set(["jogwalk", "buildups", "strides", "cuts", "sprints", "sprinttest"]);

function evaluate(date) {

  const stops = [];

  if (f.pop) stops.push("A new pop: get re-checked before loading the leg again.");
  if (f.bruise) stops.push("A spreading bruise: get re-checked.");
  if (f.weak) stops.push("Sudden weakness: get re-checked before loading the leg again.");
  const twoWeeks = addDays(S.cfg.injury, 14);
  if (date >= twoWeeks && (L.limp === "slight" || L.limp === "obvious"))
    stops.push("Still limping two weeks after the injury: get re-checked. Ask for imaging, or raise it with your doctor.");
  let nerveRun = 0;
  for (let i = 0; i < 10; i++) { const x = S.logs[addDays(date, -i)]; if (x && x.flags && x.flags.nerve) nerveRun++; else break; }
  if (nerveRun >= 3) stops.push("Nerve symptoms " + nerveRun + " days running. If easing off hasn't settled them, the plan says get re-checked.");
  let holdRun = 0;
  for (let i = 0; i < 14; i++) { if (isHold(addDays(date, -i))) holdRun++; else break; }
  if (holdRun >= 7) stops.push("A week of repeating the same level. Progress has stalled: get re-checked (imaging, or raise it with your doctor).");
  if (plan.attempt >= 3) stops.push("Week " + plan.wk + " for the " + ordinal(plan.attempt) + " week running. That's a stall of more than a week: get re-checked (imaging, or raise it with your doctor).");
  if (S.tests.finalLog.filter(x => !x.pass).length >= 2 && plan.phase === "w6") stops.push("Two 100% tests missed. Worth a re-check before a third round.");

      "If it doesn't settle after easing off, get re-checked."];

    res.lines = ["Rate it while walking around. Each morning gets compared with the one before (Rule 2)."];

      if (canHold(date) && !isHold(date)) res.actions.push({ act: "hold", label: "Repeat yesterday's level", primary: true });
      if (plan.wk >= 3) res.lines.push("Keep runs and loads at your last session's level. No progressing today.");

  if (isHold(date)) res.notes.push({ text: "Repeating Day " + plan.day + "'s level today.", act: "unhold", label: "Undo" });

  if (holdRun >= 3 && holdRun < 7) res.notes.push({ text: "Held " + holdRun + " days in a row. If it's still stuck after a week, the plan says get re-checked." });

function painPlateau(date) {

}

  }

function bandOf(p) {

function drawPainChart() {
  const el = $("#painChart"); if (!el) return;
  const W = Math.max(260, Math.round(el.clientWidth)), H = 200;
  const m = { l: 24, r: 18, t: 20, b: 44 };
  const start = S.cfg.start, today = todayStr();
  const pts = Object.keys(S.logs).filter(d => S.logs[d].pain != null && d >= start).sort().map(d => ({ d: d, v: S.logs[d].pain, limp: S.logs[d].limp }));
  let end = today;
  if (pts.length && pts[pts.length - 1].d > end) end = pts[pts.length - 1].d;
  if (diffDays(start, end) < 13) end = addDays(start, 13);
  const span = diffDays(start, end), pw = W - m.l - m.r, ph = H - m.t - m.b, step = pw / span;
  const X = d => m.l + pw * diffDays(start, d) / span, Y = v => m.t + ph * (1 - v / 10);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Morning pain by day">`;
  // phase bands
  const bands = []; let cur = null;
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const b = bandOf(planFor(d));
    if (!cur || cur.k !== b.k) { cur = Object.assign({ a: d, z: d }, b); bands.push(cur); } else cur.z = d;
  }
  s += `<g class="band">`;
  bands.forEach(b => {
    const x0 = Math.max(m.l, X(b.a) - step / 2), x1 = Math.min(W - m.r, X(b.z) + step / 2);
    s += `<rect x="${x0.toFixed(1)}" y="${m.t}" width="${Math.max(0, x1 - x0 - 1).toFixed(1)}" height="${ph}" fill="${b.c}" opacity=".07" rx="3"/>`;
    if (x1 - x0 > 30) s += `<text x="${(x0 + 5).toFixed(1)}" y="${m.t - 6}">${b.t}</text>`;
  });
  s += `</g><g class="grid">`;
  [0, 2, 4, 6, 8, 10].forEach(v => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`; });
  s += `</g><g class="axis">`;
  [0, 5, 10].forEach(v => { s += `<text x="${m.l - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`; });
  const xl = [start];
  if (today > start && today < end) xl.push(today);
  xl.push(end);
  xl.forEach((d, i) => {
    const anchor = i === 0 ? "start" : d === end ? "end" : "middle";
    if (i > 0 && d !== end && (X(end) - X(d) < 64 || X(d) - X(start) < 64)) return;
    s += `<text x="${X(d).toFixed(1)}" y="${H - m.b + 16}" text-anchor="${anchor}">${d === today ? "Today" : fmtMD(d)}</text>`;
  });
  s += `</g>`;
  // line (break over gaps longer than 2 days)
  let path = "";
  pts.forEach((p, i) => {
    const gap = i && diffDays(pts[i - 1].d, p.d) > 2;
    path += (i === 0 || gap ? "M" : "L") + X(p.d).toFixed(1) + "," + Y(p.v).toFixed(1) + " ";
  });
  if (path) s += `<path class="line" d="${path}"/>`;
  pts.forEach(p => { s += `<circle class="pt" cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"/>`; });
  if (pts.length) {
    const lp = pts[pts.length - 1], lx = X(lp.d), ly = Y(lp.v);
    s += `<text class="endlab" x="${(lx + (lx > W - 40 ? -8 : 8)).toFixed(1)}" y="${(ly - 8).toFixed(1)}" text-anchor="${lx > W - 40 ? "end" : "start"}">${lp.v}</text>`;
  }
  // limp strip
  const LC = { none: "var(--accent)", slight: "var(--hold)", obvious: "var(--stop)" };
  pts.concat(Object.keys(S.logs).filter(d => S.logs[d].pain == null && S.logs[d].limp && d >= start).map(d => ({ d: d, limp: S.logs[d].limp })))
    .forEach(p => { if (p.limp) s += `<rect class="limp" x="${(X(p.d) - 4.5).toFixed(1)}" y="${H - 17}" width="9" height="9" rx="2.5" fill="${LC[p.limp]}"/>`; });
  s += `<line class="xh" id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}" visibility="hidden"/><rect id="hit" x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="tt" id="tt" hidden></div>`;
  el.innerHTML = s;
  const hit = $("#hit", el), xh = $("#xh", el), tt = $("#tt", el), svg = $("svg", el);
  const show = ev => {
    if (!pts.length) return;
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    let best = pts[0];
    pts.forEach(p => { if (Math.abs(X(p.d) - px) < Math.abs(X(best.d) - px)) best = p; });
    const bx = X(best.d);
    xh.setAttribute("x1", bx); xh.setAttribute("x2", bx); xh.setAttribute("visibility", "visible");
    tt.hidden = false;
    tt.innerHTML = "";
    const b = document.createElement("b"); b.textContent = best.v + "/10";
    tt.appendChild(b);
    tt.appendChild(document.createTextNode(" · " + fmtShort(best.d) + (best.limp ? " · limp " + best.limp : "")));
    const sx = r.width / W;
    tt.style.left = Math.min(Math.max(bx * sx, 70), r.width - 70) + "px";
    tt.style.top = (Y(best.v) * sx - 10) + "px";
  };
  const hide = () => { xh.setAttribute("visibility", "hidden"); tt.hidden = true; };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", hide);
}

function checkinText(date) {
  const L = getLog(date) || {}, plan = planFor(date);
  const out = [];
  out.push("Rehab check-in · " + plan.eyebrow + " (" + fmtShort(date) + ") · " + plan.title + (plan.hold ? " · repeat day" : ""));
  let l2 = "Morning pain: " + (L.pain != null ? L.pain + "/10" : "not logged");
  const pp = prevPain(date);
  if (pp && L.pain != null) l2 += " (" + (pp.gap === 1 ? "yesterday" : fmtShort(pp.date)) + " " + pp.pain + "/10)";
  l2 += " · Limp: " + (L.limp || "not logged");
  out.push(l2);
  const done = [], not = [];
  plan.items.forEach(x => {
    const st = itemState(L, x.ex), name = moveName(x);
    let s;
    if (x.twice) s = name + " " + x.dose.replace(" · morning and evening", "") + ": AM " + (st.am ? "✓" : "✗") + ", PM " + (st.pm ? "✓" : "✗");
    else s = name + " (" + x.dose + ")";
    if (st.pain != null) s += " · pain " + st.pain + "/10";
    if (st.sharp) s += " · sharp";
    if (st.note) s += " · " + st.note;
    const did = x.twice ? st.am || st.pm : st.done;
    (did ? done : not).push(s);
  });
  const ids = new Set(plan.items.map(x => x.ex));
  Object.keys(L.items || {}).filter(k => !ids.has(k) && MOVES[k] && hasItemData(L.items[k])).forEach(k => {
    const st = L.items[k];
    done.push(MOVES[k].name + " (extra)" + (st.pain != null ? " · pain " + st.pain + "/10" : "") + (st.note ? " · " + st.note : ""));
  });
  if (done.length) { out.push("Done:"); done.forEach(s => out.push("✓ " + s)); }
  if (not.length) { out.push("Not done:"); not.forEach(s => out.push("✗ " + s)); }
  (plan.checks || []).forEach(c => { const v = (L.checks || {})[c.id]; if (v != null) out.push("Checkpoint: " + c.q + " " + (v ? "Yes" : "Not yet")); });
  if (showTripCard(date, plan)) {
    const t = S.tests.trip, v = tripVerdict(), m = x => x === true ? "✓" : x === false ? "✗" : "–";
    out.push("Trip check: walk " + m(t.walk) + ", next morning " + m(t.morning) + ", bridges/Diver easy " + m(t.easy) + (v ? " → " + v.text : ""));
  }
  if (plan.items.some(x => x.test === "final")) {
    const f = S.tests.final, p = curlPct(), m = x => x === true ? "pass" : x === false ? "fail" : "–";
    out.push("100% test: sprints " + m(f.sprint) + ", kick " + m(f.kick) + ", range " + m(f.range) + ", curl " + (p == null ? "–" : f.r + " R / " + f.l + " L at " + (f.w || "?") + " lb (" + Math.round(p * 100) + "%)"));
  }
  const fl = SYMPTOMS.filter(s => L.flags && L.flags[s.k]).map(s => s.short);
  out.push("Symptoms: " + (fl.length ? fl.join(", ") : "none flagged"));
  if (L.notes) out.push("Notes: " + L.notes);

}

    setGate(k, v.pass);
    if (!v.pass) S.tests.final = { sprint: null, kick: null, range: null, w: "", r: "", l: "" };
    save(); render(); toast(v.pass ? "Passed. Maintenance from here." : "Recorded. Week 5 again next week.");
  },
  gate(t) {
    const k = +t.dataset.k, v = t.dataset.v === "1" ? true : t.dataset.v === "0" ? false : "repeat";
    setGate(k, v); save(); render();
  },
  ungate(t) { S.weekResults[+t.dataset.k] = null; save(); render(); },
  share() {
    const text = checkinText(View.date);
    if (BUILD === "pages" && navigator.share) { navigator.share({ text: text }).catch(() => {}); return; }
    copyText(text, "Check-in");
  },
  copy() { copyText(checkinText(View.date), "Check-in"); },
  copytext() { const el = $("#textout"); if (!el) return; selectText(el); copyText(el.textContent); },
  mfilter(t) { View.filter = t.dataset.v; render(); },
  theme(t) { S.cfg.theme = t.dataset.v; save(); applyTheme(); render(); },
  week3auto() { S.cfg.week3 = ""; save(); render(); },
  export() { exportData(); },
  import() { importSheet(); },
  imptext() { const v = ($("#impText") || {}).value || ""; if (v.trim()) doImport(v.trim()); else toast("Choose a file or paste the backup text"); },
  reset() { confirmSheet("Erase everything?", "This deletes every day you've logged on this device, plus trip dates and test results. Back up first if you might want it.", "Erase everything", () => { S = defaultState(); save(); applyTheme(); View.date = todayStr(); toast("Erased"); }, true); },
  confirmyes() { const fn = Modal.confirmFn; Modal.confirmFn = null; if (fn) fn(); Modal.close(); },
  close() { Modal.close(); },
  backdrop(t, e) { if (e.target === t) Modal.close(); },
  dismisspreview() { S.ui.previewDismissed = true; save(); render(); },
  setup() {
    const v = ($("#setupInjury") || {}).value || "";
    if (!v) { toast("Pick the date it happened"); return; }
    if (v > todayStr()) { toast("That date is in the future"); return; }
    S.cfg.injury = v; S.cfg.start = addDays(v, 1);
    View.date = todayStr(); View.tab = "today"; save(); render(); window.scrollTo(0, 0);
  }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn) fn(t, e);
});
let noteTimer = null;
document.addEventListener("input", e => {
  const t = e.target.closest("[data-input]"); if (!t) return;
  if (t.dataset.input === "notes") { const L = ensureLog(View.date); L.notes = t.value; }
  if (t.dataset.input === "inote") { const L = ensureLog(View.date), st = L.items[t.dataset.id] = L.items[t.dataset.id] || {}; st.note = t.value; }
  clearTimeout(noteTimer); noteTimer = setTimeout(save, 300);
});
document.addEventListener("change", e => {
  const t = e.target.closest("[data-change]"); if (!t) return;
  const kind = t.dataset.change;
  if (kind === "cfg") {
    const k = t.dataset.k; let v = t.value || "";
    if (k === "week3" && v && dow(v) !== 0) { v = addDays(v, (7 - dow(v)) % 7); toast("Moved to Monday " + fmtMD(v)); }
    if ((k === "injury" || k === "start") && !v) { render(); return; }
    S.cfg[k] = v;
    if (S.cfg.tripStart && S.cfg.tripEnd && S.cfg.tripEnd < S.cfg.tripStart) { const a = S.cfg.tripStart; S.cfg.tripStart = S.cfg.tripEnd; S.cfg.tripEnd = a; toast("Swapped: leave date comes first"); }
    save(); render();
  }
  if (kind === "final") { S.tests.final[t.dataset.k] = t.value; save(); render(); }
  if (kind === "impfile") {
    const f = t.files && t.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && Modal.isOpen()) Modal.close(); });
let rsz = null;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (View.tab === "progress") drawPainChart(); }, 150); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !Modal.isOpen() && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) {
    const t = todayStr(); if (View.lastSeen && View.lastSeen !== t && View.date === View.lastSeen) View.date = t;
    View.lastSeen = t; render();
  }
});

/* ---------------- boot ---------------- */
$("#navIn").innerHTML = [["today", "Today"], ["plan", "Plan"], ["moves", "Moves"], ["progress", "Progress"]]
  .map(t => `<button data-act="tab" data-tab="${t[0]}">${IC[t[0]]}<span>${t[1]}</span></button>`).join("");
View.lastSeen = todayStr();
applyTheme();
render();
if (BUILD === "pages" && "serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
</body>
</html>
